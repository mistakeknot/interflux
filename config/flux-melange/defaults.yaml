# ============================================================================
# Flux-Melange Configuration
# ============================================================================
#
# Override per-project:    {PROJECT_ROOT}/.claude/flux-melange.yaml
# Override per-invocation:  /flux-melange path --goal="..." --weights=X --budget=N ...
#
# flux-melange is the apex of the interflux escalation ladder. Unlike
# flux-review (open-loop: triage tracks once, fan out blind, synthesize),
# it threads one scored HEAT LEDGER between adaptive rounds — each round's
# targeting is computed from the previous round's findings. Tune the loop
# here; the loop's CORRECTNESS (the continue predicate, the steering
# decoupling) lives in the engine, not in config.
# ============================================================================

# --- Goal -------------------------------------------------------------------
#
# The north star, injected verbatim into every agent prompt AND used as the
# retarget relevance filter. "Toward the heat" means "toward the heat as THIS
# goal defines it." Override with --goal="...".
#
goal: "maximize verified novelty×risk surface until dry"

# --- Weights ----------------------------------------------------------------
#
# Which derived term the per-round YIELD function boosts. Steers WHAT the loop
# considers "spice" without changing the loop mechanics.
#
#   balanced   equal weight on novelty / risk / taste terms (daily default)
#   risk-hunt  boost risk.product — for security/migration/prod-safety targets
#   taste      boost |taste| — for design reviews, API surfaces, naming passes
#   novelty    boost novelty — for "what are we NOT seeing?" exploration
#
weights: balanced

# --- Loop bounds ------------------------------------------------------------
#
# Three independent HARD halts: DRY (yield -> 0), BUDGET (slots exhausted),
# CEILING (max_rounds). min_rounds guards against one unlucky round quitting.
#
max_rounds: 4            # CEILING halt. Cap 6 (the engine refuses higher).
min_rounds: 2            # never DRY-halt before this many rounds
round_cost_floor: 3      # BUDGET halt when remaining slots < this
diminishing_threshold: 1 # a round opening <= this many new qualifying clusters is DRY
wide_threshold: 0.6      # STEER-WIDE only fires while novel_cluster_rate >= this

# --- Budget -----------------------------------------------------------------
#
# Total AGENT SLOTS across the whole run (seed + all rounds + verifiers).
# auto = derive from estimate-costs.sh + config/flux-drive/budget.yaml.
# HARD CAP 30 regardless of config — an unbounded loop is the main cost risk.
# FLUX_BUDGET_REMAINING env caps this exactly as flux-drive honors it.
#
budget: auto
max_round_slots: 8       # most agents any single round may dispatch

# --- Seed (round 0) ---------------------------------------------------------
#
# Deliberately small — the budget is for the ADAPTIVE rounds where it pays off.
# A fat seed is just flux-review with extra steps.
#
seed:
  adjacent: 3            # domain-expert lenses (flux-review Track A prompt, trimmed)
  distant: 2             # cross-domain lenses (flux-review Track C prompt)

# --- Fusion -----------------------------------------------------------------
#
# The mechanic the mode is named for. auto = <= 2 fusions/round. Depth-2
# (fusing a fused lens) only on quality=max — no unbounded compounding.
#
fusion:
  mode: auto             # auto | <int> | off
  per_round_cap: 2
  shared_heat_gate: 2    # a pair must clear this SHARED_HEAT to be fusable at all
  allow_depth_2: false   # engine forces true only when quality=max

# --- Verify -----------------------------------------------------------------
#
# CONDITIONAL by default (not a per-round tax). Fires only on findings that
# could change the report. Only `upheld` findings count toward the DRY yield.
#
verify:
  mode: auto             # auto (gated) | off | all
  novelty_gate: 2        # verify if novelty >= this ...
  risk_gate: 9           # ... OR risk.product >= this

# --- Peer runtimes ------------------------------------------------------------
#
# Multi-runtime mirrors (references/peer-runtimes.md): run the SAME loop as
# epistemically independent mirrors on external agent CLIs, then reconcile the
# syntheses in the Parley phase (phases/parley.md) — adversarial exchange to
# epistemic equilibrium, residual disagreements to the user for tie-break.
# Cost multiplies: N mirrors ~= (N+1)x slots, plus external provider billing.
#
# mode: off | auto (detect via scripts/detect-runtimes.sh) | explicit flag list
# invoke templates are CONFIG so CLI drift is fixable without engine changes;
# {model} and {projectRoot} are resolved by charter, {promptfile} by the shim.
#
# TRUST BOUNDARY (peer-runtimes.md § Trust boundary): these templates run
# external agents with AUTO-APPROVED tool use — codex --full-auto is sandboxed
# to workspace-write in projectRoot; hermes --yolo is NOT sandboxed. Only
# enable --peers on targets/repos you trust. {model} values are validated
# (letters/digits/._:- only) at both charter and the workflow chokepoint
# before substitution; paths stay double-quoted in the templates.
#
peers:
  mode: off
  runtimes:
    codex:
      model: gpt-6-astra   # mk 2026-09-19: Astra is the default codex mirror
      # -o {outfile}: codex writes ONLY the final agent message there — the shim reads it
      # instead of scraping the JSONL event stream on stdout. --output-schema was evaluated
      # and rejected (2026-07-16): it demands OpenAI strict mode (additionalProperties:false,
      # all-required at every level), incompatible with melange's loose schemas.
      # service_tier=fast: 1.5x output speed at 2.5x credit rate. Mirrors sit on the Parley
      # barrier's critical path, so wall clock buys real latency here; drop the flag in your
      # project flux-melange.yaml if credit burn matters more than wall clock.
      # model_reasoning_effort=medium (mk 2026-09-19): a mirror's job is independent coverage,
      # not depth — probe tasks are scoped and numerous, and Astra's reasoning tokens multiply
      # wall clock and cost fast. Medium is a deliberate floor for a mirror, not a degraded
      # setting. Raise per-project only if a mirror's misses look depth-shaped.
      invoke: 'codex exec --full-auto --skip-git-repo-check --ephemeral -C "{projectRoot}" -m "{model}" -c service_tier="fast" -c model_reasoning_effort="medium" -o "{outfile}" - < "{promptfile}"'
    hermes:
      # mk 2026-09-19: DeepSeek v4.1 Flash is the default hermes mirror. Its canonical id is
      # provider-prefixed (deepseek/deepseek-v4.1-flash) and that '/' fails the peer-model
      # regex (^[A-Za-z0-9._:-]{1,64}$) — so, exactly as kimi documents below, the real id
      # lives in the invoke template and `model:` stays null, leaving {model_flag} empty.
      # --provider openrouter is pinned because openrouter is the only configured provider
      # carrying any deepseek model (checked against ~/.hermes/provider_models_cache.json);
      # without it hermes silently falls back to its own configured default.
      model: null
      invoke: 'cd "{projectRoot}" && hermes -z "$(cat "{promptfile}")" -m "deepseek/deepseek-v4.1-flash" --provider openrouter --yolo'   # {model_flag} = " -m {model}" when model set, else ""
    kimi:
      model: k3            # canonical Kimi Coding Plan model id (1M ctx, reasoning-only)
      # kimi is a DUAL-LANE runtime; the scripts/kimi-peer-invoke.sh wrapper and
      # detect-runtimes.sh apply the same preference order, and both lanes write
      # ONLY the final assistant message to {outfile} (same file-extraction
      # contract as codex's -o, so the shim path is identical):
      #   lane 1 (preferred) — Kimi Code CLI on subscription OAuth, headless
      #     `kimi --output-format stream-json -p ...` (no API key). The CLI
      #     model ALIAS is kimi-code/k3 — its '/' would fail the peer-model
      #     regex (^[A-Za-z0-9._:-]{1,64}$), so the k3 -> kimi-code/k3 mapping
      #     lives in the wrapper (KIMI_CLI_MODEL overrides) and `model:` here
      #     stays the regex-safe id. TRUST: -p auto-approves regular tool
      #     calls, so this lane runs a tool-enabled agent in {projectRoot},
      #     UNSANDBOXED (hermes-class), and the user's kimi hooks fire in-run.
      #   lane 2 (fallback) — HTTP POST to the Kimi coding endpoint with
      #     KIMI_API_KEY (env / ~/.hermes/.env): no local execution, pure
      #     data egress. K3 requires temperature=1 and no max_tokens cap;
      #     baked into the wrapper. Creds never interpolated into this template.
      # Wall-clock: K3 measured 7.7x slower than gpt-5.6-luna on a sealed parity
      # eval (FLUXrig typed_edges, 2026-07-23) — a kimi mirror can dominate the
      # Parley barrier; watch mirror latency before making it a default peer.
      invoke: 'cd "{projectRoot}" && {pluginRoot}/scripts/kimi-peer-invoke.sh "{promptfile}" "{outfile}"'
  exchange:
    max_rounds: 3          # Parley cap; fixed point usually lands in 1-2

# --- Reviewer routing -------------------------------------------------------
#
# `peers` above remains the economical, high-volume mirror lane. This separate
# table resolves a consequential validation reviewer relative to the producer:
# Claude/Fable or Kimi output is reviewed by Astra; Astra output is reviewed by
# an external model first, with Sol as the final fallback. The charter invokes
# scripts/select-review-route.py instead of reconstructing this policy in prose.
#
reviewer_routing:
  model_aliases:
    fable: claude-fable-5-1
    gpt-5.6: gpt-5.6-sol
    k3: kimi-code/k3
    kimi/k3: kimi-code/k3
  profiles:
    sol-bulk:
      kind: codex
      model: gpt-5.6-sol
      reasoning_effort: high
      service_tier: fast
      invoke: 'codex exec --full-auto --skip-git-repo-check --ephemeral -C "{projectRoot}" -m "{model}" -c service_tier="fast" -c model_reasoning_effort="high" -o "{outfile}" - < "{promptfile}"'
    astra-review:
      kind: codex
      model: gpt-6-astra
      reasoning_effort: high
      service_tier: standard
      minimum_codex_version: 0.153.1
      invoke: 'codex exec --full-auto --skip-git-repo-check --ephemeral -C "{projectRoot}" -m "{model}" -c service_tier="default" -c model_reasoning_effort="high" -o "{outfile}" - < "{promptfile}"'
    fable-review:
      kind: claude
      model: claude-fable-5-1
      reasoning_effort: high
      service_tier: standard
      invoke: 'claude -p --model "{model}" --permission-mode dontAsk --disallowedTools "Write,Edit,MultiEdit,NotebookEdit" < "{promptfile}" > "{outfile}"'
    kimi-review:
      kind: kimi
      model: k3
      reasoning_effort: high
      service_tier: standard
      invoke: 'cd "{projectRoot}" && env NTSMR_KIMI_MODEL="{model}" KIMI_CLI_MODEL="kimi-code/{model}" {pluginRoot}/scripts/kimi-peer-invoke.sh "{promptfile}" "{outfile}"'
  routes:
    bulk: [sol-bulk]
    validation:
      producer_model:
        gpt-6-astra: [fable-review, kimi-review, sol-bulk]
      producer_kind:
        claude: [astra-review, sol-bulk]
        kimi: [astra-review, sol-bulk]
      default: [fable-review, kimi-review, sol-bulk]

# --- Quality / model routing ------------------------------------------------
#
# economy = all Sonnet (+ skip taste). balanced = Opus on creative/judgment
# steps (fused-lens design, taste, synthesis), Sonnet on lens application.
# max = all Opus + depth-2 fusion. See references/budget-ladder.md for the
# full per-step routing table.
#
quality: balanced

# --- Interactive ------------------------------------------------------------
#
# Default auto-proceed (the loop is deterministic). --interactive restores the
# per-round confirmation and the GOAL-MET soft-stop prompt.
#
interactive: false

# ============================================================================
# Cost reference (rough, ~per agent slot)
#
#   2-round economy:   ~8-10 slots   ~$1     (quick adaptive pass)
#   3-round balanced:  ~15-18 slots  ~$5     (the daily driver)
#   4-round balanced:  ~22-26 slots  ~$8     (design/architecture targets)
#   to-dry max:        up to 30 cap  ~$15    (high-stakes, risk-hunt or taste)
#
# Cost is loop-shaped, not track-shaped: a target that goes DRY in 2 rounds
# costs far less than max_rounds suggests. The budget cap is the ceiling, the
# DRY halt is the usual exit.
# ============================================================================
